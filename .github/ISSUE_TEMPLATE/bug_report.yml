name: Bug report
description: Report a reproducible problem in Xtream Player
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove provider URLs, usernames, passwords, and playlist data from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main / commit SHA
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: Fedora 44, GNOME 49
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
